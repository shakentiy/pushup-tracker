// Precompute total set count per exercise per day, and grand totals
var dayMeta = {}; // idx -> {puTotalSets, sqTotalSets}
var grandTotalSets = 0;
var grandTotalDays = 0;

for (var i = 0; i < D.length; i++) {
  var row = D[i];
  if (row[4] === 'R') continue;
  var idx = row[0], puBlocks = row[7], sqBlocks = row[8];
  var puN = 0, sqN = 0;
  for (var b = 0; b < puBlocks.length; b++) puN += puBlocks[b][1].length;
  for (var b = 0; b < sqBlocks.length; b++) sqN += sqBlocks[b][1].length;
  dayMeta[idx] = { puN: puN, sqN: sqN };
  grandTotalSets += puN + sqN;
  grandTotalDays++;
}

function setKey(dayIdx, ex, blockI, setI) { return dayIdx + '_' + ex + '_' + blockI + '_' + setI; }

function dayDoneCounts(idx) {
  var row = null;
  for (var i = 0; i < D.length; i++) { if (D[i][0] === idx) { row = D[i]; break; } }
  if (!row || row[4] === 'R') return {done:0, total:0};
  var puBlocks = row[7], sqBlocks = row[8];
  var done = 0, total = 0;
  for (var b = 0; b < puBlocks.length; b++) {
    var reps = puBlocks[b][1];
    for (var s = 0; s < reps.length; s++) {
      total++;
      if (saved[setKey(idx,'pu',b,s)]) done++;
    }
  }
  for (var b = 0; b < sqBlocks.length; b++) {
    var reps = sqBlocks[b][1];
    for (var s = 0; s < reps.length; s++) {
      total++;
      if (saved[setKey(idx,'sq',b,s)]) done++;
    }
  }
  return {done: done, total: total};
}

function isDayFullyDone(idx) {
  var c = dayDoneCounts(idx);
  return c.total > 0 && c.done === c.total;
}

function typeColor(tp) {
  if (!tp) return '#d1d5db';
  if (tp.indexOf('Широкие') !== -1) return '#3b82f6';
  if (tp.indexOf('Узкие') !== -1) return '#8b5cf6';
  if (tp.indexOf('Тест') !== -1 || tp.indexOf('ФИНАЛ') !== -1) return '#f97316';
  return '#22c55e';
}

var toastT = null;
function toast(msg) {
  var el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast show';
  if (toastT) clearTimeout(toastT);
  toastT = setTimeout(function() { el.className = 'toast'; }, 1400);
}

function updateUI() {
  var doneSets = 0;
  for (var k in saved) { if (saved[k]) doneSets++; }
  document.getElementById('s-sets').textContent = doneSets;
  var pct = grandTotalSets ? Math.round(doneSets / grandTotalSets * 100) : 0;
  document.getElementById('s-pct').textContent = pct + '%';
  document.getElementById('prog-fill').style.width = pct + '%';
  document.getElementById('prog-label').textContent = doneSets + ' / ' + grandTotalSets;

  var fullDays = 0;
  for (var idx in dayMeta) {
    if (isDayFullyDone(parseInt(idx))) fullDays++;
  }
  document.getElementById('s-days').textContent = fullDays + ' / ' + grandTotalDays;

  // next incomplete day (active or rest)
  var nxt = null;
  for (var i = 0; i < D.length; i++) {
    var row = D[i];
    var idx = row[0];
    if (row[4] === 'R') {
      if (!saved['rest_' + idx]) { nxt = row; break; }
    } else {
      if (!isDayFullyDone(idx)) { nxt = row; break; }
    }
  }
  if (nxt) {
    document.getElementById('next-box').style.display = 'block';
    document.getElementById('finish-box').style.display = 'none';
    if (nxt[4] === 'R') {
      document.getElementById('next-main').textContent = 'Нед ' + nxt[2] + ' \xb7 ' + nxt[3];
      document.getElementById('next-sub').textContent = nxt[5];
    } else {
      var c = dayDoneCounts(nxt[0]);
      document.getElementById('next-main').textContent = 'Нед ' + nxt[2] + ' \xb7 ' + nxt[3];
      document.getElementById('next-sub').textContent = nxt[5] + ' отжиманий + ' + nxt[5] + ' приседаний \xb7 ' + c.done + '/' + c.total + ' подходов';
    }
  } else {
    document.getElementById('next-box').style.display = 'none';
    document.getElementById('finish-box').style.display = 'block';
  }
}

function toggleSet(dayIdx, ex, blockI, setI, reps) {
  var key = setKey(dayIdx, ex, blockI, setI);
  saved[key] = !saved[key];
  persist();
  var btn = document.getElementById('sb_' + key);
  var onClass = ex === 'pu' ? 'set-btn on-pu' : 'set-btn on-sq';
  if (saved[key]) {
    btn.className = onClass;
    toast('\u2713 ' + reps + ' \u0432\u044b\u043f\u043e\u043b\u043d\u0435\u043d\u043e');
  } else {
    btn.className = 'set-btn';
  }
  // update day header state
  refreshDayHeader(dayIdx);
  updateUI();
}

function refreshDayHeader(idx) {
  var c = dayDoneCounts(idx);
  var dayEl = document.getElementById('day_' + idx);
  if (!dayEl) return;
  var fracEl = document.getElementById('frac_' + idx);
  if (fracEl) fracEl.textContent = c.done + '/' + c.total;
  if (c.done === c.total && c.total > 0) {
    dayEl.className = 'day done';
  } else {
    dayEl.className = 'day';
  }
}

function toggleRest(idx) {
  var key = 'rest_' + idx;
  saved[key] = !saved[key];
  persist();
  var el = document.getElementById('day_' + idx);
  if (saved[key]) {
    el.className = 'rest done';
    toast('\u2713 \u041e\u0442\u0434\u044b\u0445 \u0437\u0430\u0441\u0447\u0438\u0442\u0430\u043d!');
  } else {
    el.className = 'rest';
  }
  updateUI();
}

function toggleDayOpen(idx) {
  var body = document.getElementById('body_' + idx);
  var arrow = document.getElementById('arrow_' + idx);
  if (!body) return;
  var isOpen = body.className.indexOf('open') !== -1;
  if (isOpen) {
    body.className = 'day-body';
    arrow.className = 'day-arrow';
  } else {
    body.className = 'day-body open';
    arrow.className = 'day-arrow open';
  }
}

    '<div class="dchk">\u2713</div>' +
    '<div class="day-info"><div class="day-top"><span class="day-week">Нед ' + week + '</span><span class="day-name">' + dayName + '</span></div><div class="day-sub">' + total + ' отжим. + ' + total + ' присед. \xb7 ' + typ + '</div></div>' +
    '<div class="day-right"><div class="day-frac" id="frac_' + idx + '">' + c.done + '/' + c.total + '</div><div class="day-type" style="color:' + tc + '">подходов</div></div>' +
    '<div class="day-arrow" id="arrow_' + idx + '">\u25be</div>';
  dayEl.appendChild(hdrRow);

  var bodyEl = document.createElement('div');
  bodyEl.id = 'body_' + idx;
  bodyEl.className = 'day-body';

  // Pushups group
  var puHtml = '<div class="ex-group"><div class="ex-label"><span class="dot" style="background:#22c55e"></span>Отжимания</div>';
  for (var b = 0; b < puBlocks.length; b++) {
    var blkLabel = puBlocks[b][0];
    var reps = puBlocks[b][1];
    if (blkLabel) puHtml += '<div class="blk-label">' + blkLabel + '</div>';
    puHtml += '<div class="sets-wrap">';
    for (var s = 0; s < reps.length; s++) {
      var key = setKey(idx, 'pu', b, s);
      var on = saved[key] ? ' on-pu' : '';
      puHtml += '<div class="set-btn' + on + '" id="sb_' + key + '" onclick="event.stopPropagation();toggleSet(' + idx + ',\'pu\',' + b + ',' + s + ',' + reps[s] + ')">' + reps[s] + '</div>';
    }
    puHtml += '</div>';
  }
  puHtml += '</div>';

  // Squats group
  var sqHtml = '<div class="ex-group"><div class="ex-label"><span class="dot" style="background:#f97316"></span>Приседания</div>';
  for (var b = 0; b < sqBlocks.length; b++) {
    var blkLabel = sqBlocks[b][0];
    var reps = sqBlocks[b][1];
    if (blkLabel) sqHtml += '<div class="blk-label">' + blkLabel + '</div>';
    sqHtml += '<div class="sets-wrap">';
    for (var s = 0; s < reps.length; s++) {
      var key = setKey(idx, 'sq', b, s);
      var on = saved[key] ? ' on-sq' : '';
      sqHtml += '<div class="set-btn' + on + '" id="sb_' + key + '" onclick="event.stopPropagation();toggleSet(' + idx + ',\'sq\',' + b + ',' + s + ',' + reps[s] + ')">' + reps[s] + '</div>';
    }
    sqHtml += '</div>';
  }
  sqHtml += '</div>';

  bodyEl.innerHTML = puHtml + sqHtml;
  dayEl.appendChild(bodyEl);

  cardsEl.appendChild(dayEl);
}

updateUI();
</script>
</body>
</html>
