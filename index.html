  for (var k in saved) { if (saved[k]) n++; }
  document.getElementById('s-done').textContent = n;
  var pct = Math.round(n / totalDays * 100);
  document.getElementById('s-pct').textContent = pct + '%';
  document.getElementById('prog-fill').style.width = pct + '%';
  document.getElementById('prog-label').textContent = n + ' / ' + totalDays;
  var streak = 0;
  for (var i = 0; i < D.length; i++) {
    if (saved[D[i][0]]) streak++;
    else break;
  }
  document.getElementById('s-streak').textContent = streak;
  var nxt = null;
  for (var i = 0; i < D.length; i++) {
    if (!saved[D[i][0]]) { nxt = D[i]; break; }
  }
  if (nxt) {
    document.getElementById('next-box').style.display = 'block';
    document.getElementById('finish-box').style.display = 'none';
    document.getElementById('next-main').textContent = 'Нед ' + nxt[2] + ' \xb7 ' + nxt[3] + ' \u2014 ' + nxt[4];
    document.getElementById('next-sub').textContent = nxt[5] ? nxt[5] + ' отжиманий \xb7 ' + nxt[6] : 'День отдыха — восстановление';
  } else {
    document.getElementById('next-box').style.display = 'none';
    document.getElementById('finish-box').style.display = 'block';
  }
}

var toastT = null;
function toast(msg) {
  var el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast show';
  if (toastT) clearTimeout(toastT);
  toastT = setTimeout(function() { el.className = 'toast'; }, 1600);
}

function toggle(idx) {
  saved[idx] = !saved[idx];
  persist();
  var isRest = (D[idx][5] === 0);
  var cardEl = document.getElementById('c' + idx);
  if (saved[idx]) {
    cardEl.className = isRest ? 'rest done' : 'card done';
    toast(isRest ? '\u2713 Отдых засчитан!' : '\u2713 Выполнено!');
  } else {
    cardEl.className = isRest ? 'rest' : 'card';
    toast('Убрано');
  }
  updateUI();
}

var root = document.getElementById('root');
var curPh = '';
var cardsEl = null;

for (var i = 0; i < D.length; i++) {
  var row = D[i];
  var idx = row[0], ph = row[1], wk = row[2], dn = row[3], pr = row[4], tot = row[5], tp = row[6];
  var isRest = (tot === 0);

  if (ph !== curPh) {
    curPh = ph;
    var m = PH[ph];
    var hdrEl = document.createElement('div');
    hdrEl.className = 'ph-hdr';
    hdrEl.innerHTML = '<span class="ph-badge ' + m[3] + '">' + m[0] + '</span><span class="ph-name">' + m[1] + '</span><span class="ph-weeks">' + m[2] + '</span>';
    root.appendChild(hdrEl);
    cardsEl = document.createElement('div');
    cardsEl.className = 'cards';
    root.appendChild(cardsEl);
  }

  var cardEl = document.createElement('div');
  cardEl.id = 'c' + idx;

  if (isRest) {
    cardEl.className = 'rest' + (saved[idx] ? ' done' : '');
    cardEl.innerHTML = '<div class="chk">\u2713</div><div class="card-info"><div class="card-top"><span class="card-week">Нед ' + wk + '</span><span class="card-day">' + dn + '</span></div><div class="card-proto">' + pr + '</div></div><div class="card-right">\u2014</div>';
  } else {
    cardEl.className = 'card' + (saved[idx] ? ' done' : '');
    cardEl.innerHTML = '<div class="chk">\u2713</div><div class="card-info"><div class="card-top"><span class="card-week">Нед ' + wk + '</span><span class="card-day">' + dn + '</span></div><div class="card-proto">' + pr + '</div></div><div class="card-right"><div class="card-total">' + tot + '</div><div class="card-type"><span style="display:inline-block;width:5px;height:5px;border-radius:50%;background:' + tc(tp) + ';vertical-align:middle;margin-right:3px"></span>' + tp + '</div></div>';
  }

  cardEl.setAttribute('onclick', 'toggle(' + idx + ')');
  cardsEl.appendChild(cardEl);
}

updateUI();
</script>
</body>
</html>
